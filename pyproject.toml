[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "semantic-runtime"
version = "0.2.0"
description = "Semantic infrastructure layer for AI Agents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["semantic", "mcp", "ai-agent", "infrastructure"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["pyyaml>=6.0", "mcp>=1.2,<2.0"]

[project.urls]
Homepage = "https://github.com/Chloride233/semantic-runtime"
Repository = "https://github.com/Chloride233/semantic-runtime"
Issues = "https://github.com/Chloride233/semantic-runtime/issues"
Documentation = "https://github.com/Chloride233/semantic-runtime/tree/main/docs"

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff==0.15.22",
]
postgres = ["psycopg[binary]>=3.1"]
mysql = ["pymysql>=1.1"]
snowflake = ["snowflake-connector-python>=3.10"]

[tool.hatch.build.targets.wheel]
packages = ["src/semantic_runtime"]
include = ["semantic_runtime/packs/*/semantic_model.yaml"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "integration: tests requiring external services or subprocesses",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint.isort]
known-first-party = ["semantic_runtime"]
